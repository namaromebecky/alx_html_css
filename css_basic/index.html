<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flexbox Layout</title>
  <link href="base.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Header content here</h1>
  </header>

  <main>
    <article>
      <p>Main article content here. This will take 2/3 of the width.</p>
      <p>More text... more text... (scrollable)</p>
    </article>

    <aside>
      <p>Aside content here. This will take 1/3 of the width.</p>
    </aside>
  </main>

  <footer>
    <p>Footer content here</p>
  </footer>
</body>
</html>
